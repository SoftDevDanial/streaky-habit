<svg xmlns="http://www.w3.org/2000/svg" width="325" height="66" viewBox="0 0 325 66" role="img" aria-labelledby="streaks-lockup-light-title">
  <title id="streaks-lockup-light-title">Streaks</title>
  <!-- Streaks lockup for light pages. Mark #3B6B60 (bead token), word #2E5A50 (bead-deep token).
       Contrast on #ffffff is 6.1:1 for the mark and 7.8:1 for the word. On the app page #F2F5F3 it is 5.5:1 and 7.1:1.
       Mark is 1.3 times the cap height with m = 5, set 2 units low so its top heavy run sits optically on the cap band.
       Gap to the word is 7m, one bead pitch.
       The word is live text in the app font stack at weight 700, never outlined, so no font outlines ship in the repo.
       textLength keeps the lockup width fixed across system fonts. -->
  <path fill="#3B6B60" d="M22.5 9H37.5A12.5 12.5 0 1 1 37.5 24H22.5A12.5 12.5 0 0 1 20 26.5V41.5A12.5 12.5 0 1 1 5 41.5V26.5A12.5 12.5 0 1 1 22.5 9ZM47.5 39A12.5 12.5 0 0 1 47.5 64A12.5 12.5 0 0 1 47.5 39ZM47.5 44A7.5 7.5 0 0 0 47.5 59A7.5 7.5 0 0 0 47.5 44Z"/>
  <text x="95" y="55" fill="#2E5A50" font-family="ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-0.66" textLength="230" lengthAdjust="spacing">Streaks</text>
</svg>
