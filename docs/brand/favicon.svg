<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <title>Streaks</title>
  <!-- Streaks favicon. The mark itself, not a reduction, at module m = 1 px on a 16 px grid. Beads 5 px, thread 3 px,
       gaps 2 px, ring stroke 1 px, hole 3 px, 2 px margin, so every bead, thread and gap edge box lands on whole
       pixels at 16 and 32 px and the mark fills 12 of 16 px both ways.
       Solid bead-green ground (#3B6B60) so it holds on light and dark tabs, mark #F7FAF9 at 5.8:1.
       Square corners, no baked rounding. The dashed holding thread is not used anywhere in the system. -->
  <rect width="16" height="16" fill="#3B6B60"/>
  <path fill="#F7FAF9" d="M6.5 3H9.5A2.5 2.5 0 1 1 9.5 6H6.5A2.5 2.5 0 0 1 6 6.5V9.5A2.5 2.5 0 1 1 3 9.5V6.5A2.5 2.5 0 1 1 6.5 3ZM11.5 9A2.5 2.5 0 0 1 11.5 14A2.5 2.5 0 0 1 11.5 9ZM11.5 10A1.5 1.5 0 0 0 11.5 13A1.5 1.5 0 0 0 11.5 10Z"/>
</svg>
